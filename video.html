<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시네마틱 감상관 - 프리미엄 비디오 플레이어</title>
  <meta name="description" content="유튜브 영상을 감각적인 무드 앰비언트 라이트와 함께 시네마틱한 최상의 환경에서 감상하세요.">
  
  <!-- Open Graph -->
  <meta property="og:title" content="시네마틱 감상관 - 프리미엄 플레이어">
  <meta property="og:description" content="감각적인 무드 앰비언트 라이팅과 함께 최고의 영상 몰입감을 느껴보세요.">
  <meta property="og:type" content="website">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">

  <style>
    /* CSS Variables for Dynamic Ambient Moods */
    :root {
      --bg-color: #09090b;
      --gradient-base: linear-gradient(135deg, #09090b 0%, #111115 50%, #181024 100%);
      --glow-color: rgba(139, 92, 246, 0.45);
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-highlight: rgba(255, 255, 255, 0.15);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-color: #a78bfa;
      --transition-smooth: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Themes Stylesheet */
    body.theme-midnight {
      --gradient-base: linear-gradient(135deg, #09090b 0%, #111115 50%, #1c162e 100%);
      --glow-color: rgba(139, 92, 246, 0.45);
      --accent-color: #a78bfa;
    }

    body.theme-sunset {
      --gradient-base: linear-gradient(135deg, #0f0707 0%, #1c0a0c 50%, #2e120d 100%);
      --glow-color: rgba(249, 115, 22, 0.35);
      --accent-color: #fb923c;
    }

    body.theme-cyberpunk {
      --gradient-base: linear-gradient(135deg, #030008 0%, #0c001a 50%, #1a001a 100%);
      --glow-color: rgba(236, 72, 153, 0.45);
      --accent-color: #f472b6;
    }

    body.theme-forest {
      --gradient-base: linear-gradient(135deg, #050806 0%, #08120b 50%, #0d2414 100%);
      --glow-color: rgba(52, 211, 153, 0.3);
      --accent-color: #34d399;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', 'Noto Sans KR', sans-serif;
      background: var(--gradient-base);
      background-attachment: fixed;
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      overflow-x: hidden;
      transition: var(--transition-smooth);
    }

    /* Cinematic Mode Background Dimmer Overlay */
    .dimmer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      opacity: 0;
      pointer-events: none;
      z-index: 10;
      transition: var(--transition-smooth);
    }

    body.theater-mode .dimmer-overlay {
      opacity: 1;
      pointer-events: all;
    }

    /* Layout Wrapper */
    .player-container {
      width: 100%;
      max-width: 1040px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 30px;
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Ambient Glow Behind Video */
    .video-glow-wrapper {
      position: relative;
      width: 100%;
      border-radius: 24px;
      background: #000;
      overflow: visible; /* To let the glowing shadow spread */
    }

    .ambient-glow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--glow-color);
      border-radius: 24px;
      filter: blur(60px);
      opacity: 0.85;
      z-index: -1;
      transform: scale(0.98);
      transition: var(--transition-smooth);
      animation: glowPulse 8s ease-in-out infinite alternate;
    }

    body.glow-off .ambient-glow {
      opacity: 0 !important;
    }

    /* Beautiful Responsive Video Frame */
    .video-aspect-box {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid var(--glass-border);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      transition: var(--transition-smooth);
    }

    .video-aspect-box iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Glassmorphic Control & Info Dashboard */
    .player-dashboard {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      display: grid;
      grid-template-columns: 1.6fr 1.4fr;
      gap: 30px;
      transition: var(--transition-smooth);
    }

    /* Left Info Column */
    .video-details {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .video-tag {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      padding: 6px 14px;
      border-radius: 50px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent-color);
      letter-spacing: 1px;
      align-self: flex-start;
      margin-bottom: 15px;
      text-transform: uppercase;
      transition: var(--transition-smooth);
    }

    .video-title {
      font-size: 1.6rem;
      font-weight: 800;
      line-height: 1.4;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #ffffff, #e2e8f0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .video-description {
      font-size: 0.95rem;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 25px;
    }

    /* Toolbar / Interactive Controls */
    .player-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: auto;
    }

    .btn-action {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      color: var(--text-primary);
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition-smooth);
      font-family: inherit;
    }

    .btn-action:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    .btn-action.active {
      background: var(--text-primary);
      color: var(--bg-color);
      border-color: var(--text-primary);
    }

    .btn-action svg {
      transition: var(--transition-smooth);
    }

    .btn-action:hover svg {
      transform: scale(1.1);
    }

    /* Right Interactive Features Column */
    .video-features {
      display: flex;
      flex-direction: column;
      gap: 24px;
      border-left: 1px solid var(--glass-border);
      padding-left: 30px;
    }

    .feature-group-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .feature-group-title::before {
      content: '';
      display: block;
      width: 3px;
      height: 14px;
      background: var(--accent-color);
      border-radius: 1px;
      transition: var(--transition-smooth);
    }

    /* Ambient Theme Selector */
    .theme-selector-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .theme-bubble {
      height: 42px;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 600;
      transition: var(--transition-smooth);
      position: relative;
      overflow: hidden;
    }

    .theme-bubble::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0.15;
      transition: var(--transition-smooth);
    }

    .theme-bubble:hover {
      transform: scale(1.05);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .theme-bubble.active {
      border-color: var(--accent-color);
      box-shadow: 0 0 10px var(--glow-color);
    }

    .theme-bubble-midnight { background: #1c162e; color: #a78bfa; }
    .theme-bubble-sunset { background: #2e120d; color: #fb923c; }
    .theme-bubble-cyberpunk { background: #1a001a; color: #f472b6; }
    .theme-bubble-forest { background: #0d2414; color: #34d399; }

    /* Interactive Notes (Bookmarks) */
    .bookmarks-panel {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .note-input-container {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .note-input {
      flex-grow: 1;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.85rem;
      outline: none;
      transition: var(--transition-smooth);
    }

    .note-input:focus {
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--accent-color);
    }

    .btn-add-note {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: var(--text-primary);
      padding: 0 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .btn-add-note:hover {
      background: var(--text-primary);
      color: var(--bg-color);
    }

    .notes-list {
      max-height: 120px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
    }

    .notes-list::-webkit-scrollbar {
      width: 4px;
    }

    .notes-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 4px;
    }

    .note-item {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      animation: slideIn 0.3s ease-out;
    }

    .note-text {
      color: var(--text-secondary);
      word-break: break-all;
    }

    .btn-delete-note {
      background: transparent;
      border: none;
      color: #ef4444;
      cursor: pointer;
      opacity: 0.6;
      transition: var(--transition-smooth);
      padding: 2px;
    }

    .btn-delete-note:hover {
      opacity: 1;
      transform: scale(1.1);
    }

    /* Keyframes */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-10px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes glowPulse {
      0% {
        transform: scale(0.98);
        filter: blur(55px);
        opacity: 0.8;
      }
      100% {
        transform: scale(1.02);
        filter: blur(75px);
        opacity: 0.95;
      }
    }

    /* Responsive adjustments */
    @media (max-width: 820px) {
      .player-dashboard {
        grid-template-columns: 1fr;
        gap: 30px;
      }

      .video-features {
        border-left: none;
        padding-left: 0;
        padding-top: 25px;
        border-top: 1px solid var(--glass-border);
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 20px 10px;
      }
      
      .video-title {
        font-size: 1.3rem;
      }

      .btn-action {
        flex-grow: 1;
        justify-content: center;
      }
    }
  </style>
</head>
<body class="theme-midnight">

  <!-- Cinematic Background Dimmer -->
  <div class="dimmer-overlay" id="dimmer" onclick="toggleTheaterMode()"></div>

  <main class="player-container">
    
    <!-- Ambilight Screen Wrapper -->
    <div class="video-glow-wrapper">
      <div class="ambient-glow" id="glowLight"></div>
      
      <div class="video-aspect-box">
        <!-- Embed code for youtube video Fyzz8QV35FE -->
        <iframe 
          id="ytPlayer"
          src="https://www.youtube.com/embed/Fyzz8QV35FE?enablejsapi=1&rel=0&showinfo=0" 
          title="추천 유튜브 음악 영상" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
          allowfullscreen>
        </iframe>
      </div>
    </div>

    <!-- Glassmorphic Dashboard Details -->
    <section class="player-dashboard">
      
      <!-- Video Metadata & Quick Controls -->
      <div class="video-details">
        <div>
          <div class="video-tag" id="themeTag">Midnight Ambient</div>
          <h1 class="video-title">도시의 밤을 수놓는 아늑한 음악 플레이리스트</h1>
          <p class="video-description">
            감성적인 선율과 도시의 불빛이 어우러지는 힐링 비디오입니다. 어두운 방, 무드 조명 테마와 함께 편안한 시간 속에 잠겨보세요.
          </p>
        </div>

        <div class="player-toolbar">
          <!-- Ambient Light Toggle -->
          <button class="btn-action active" id="btnGlow" onclick="toggleAmbientGlow()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"/>
              <line x1="12" y1="1" x2="12" y2="3"/>
              <line x1="12" y1="21" x2="12" y2="23"/>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
              <line x1="1" y1="12" x2="3" y2="12"/>
              <line x1="21" y1="12" x2="23" y2="12"/>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
            <span>조명 켜짐</span>
          </button>

          <!-- Theater Mode Toggle -->
          <button class="btn-action" id="btnTheater" onclick="toggleTheaterMode()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/>
              <line x1="7" y1="2" x2="7" y2="22"/>
              <line x1="17" y1="2" x2="17" y2="22"/>
              <line x1="2" y1="12" x2="22" y2="12"/>
              <line x1="2" y1="7" x2="7" y2="7"/>
              <line x1="2" y1="17" x2="7" y2="17"/>
              <line x1="17" y1="17" x2="22" y2="17"/>
              <line x1="17" y1="7" x2="22" y2="7"/>
            </svg>
            <span>시네마 뷰</span>
          </button>

          <!-- Copy Link -->
          <button class="btn-action" onclick="copyVideoLink()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
            </svg>
            <span>공유하기</span>
          </button>
        </div>
      </div>

      <!-- Right Interactive Column: Custom Moods and Note Board -->
      <div class="video-features">
        <!-- 1. Ambient Mood Selectors -->
        <div>
          <h2 class="feature-group-title">공간 앰비언트 무드</h2>
          <div class="theme-selector-grid">
            <button class="theme-bubble theme-bubble-midnight active" onclick="setTheme('midnight', 'Midnight Ambient')">Midnight</button>
            <button class="theme-bubble theme-bubble-sunset" onclick="setTheme('sunset', 'Golden Sunset')">Sunset</button>
            <button class="theme-bubble theme-bubble-cyberpunk" onclick="setTheme('cyberpunk', 'Neon Synthwave')">Cyber</button>
            <button class="theme-bubble theme-bubble-forest" onclick="setTheme('forest', 'Emerald Forest')">Forest</button>
          </div>
        </div>

        <!-- 2. Interactive Quick Bookmark Notes -->
        <div class="bookmarks-panel">
          <h2 class="feature-group-title">감상 타임라인 & 노트</h2>
          
          <div class="note-input-container">
            <input type="text" class="note-input" id="noteInput" placeholder="이 구절에 적고 싶은 생각이나 낙서..." onkeypress="handleNoteKeypress(event)" aria-label="감상 노트 내용">
            <button class="btn-add-note" onclick="addNote()">작성</button>
          </div>

          <div class="notes-list" id="notesList">
            <!-- Dynamically populated from localStorage -->
          </div>
        </div>
      </div>

    </section>
  </main>

  <script>
    // Theme changing
    function setTheme(themeName, displayTag) {
      // Remove all theme classes from body
      document.body.className = document.body.className.replace(/\btheme-\S+/g, '');
      
      // Keep theater-mode/glow-off if they exist
      document.body.classList.add('theme-' + themeName);
      
      // Update active bubble style
      document.querySelectorAll('.theme-bubble').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.querySelector('.theme-bubble-' + themeName);
      if (activeBtn) activeBtn.classList.add('active');

      // Update Tag Info
      document.getElementById('themeTag').innerText = displayTag;
    }

    // Toggle Ambient Light Overlay
    function toggleAmbientGlow() {
      const isGlowOff = document.body.classList.toggle('glow-off');
      const btn = document.getElementById('btnGlow');
      
      if (isGlowOff) {
        btn.classList.remove('active');
        btn.querySelector('span').innerText = '조명 꺼짐';
      } else {
        btn.classList.add('active');
        btn.querySelector('span').innerText = '조명 켜짐';
      }
    }

    // Toggle Cinema Theater Mode
    function toggleTheaterMode() {
      const isTheater = document.body.classList.toggle('theater-mode');
      const btn = document.getElementById('btnTheater');
      
      if (isTheater) {
        btn.classList.add('active');
        btn.querySelector('span').innerText = '시네마 On';
      } else {
        btn.classList.remove('active');
        btn.querySelector('span').innerText = '시네마 뷰';
      }
    }

    // Copy Link Helper
    function copyVideoLink() {
      const videoUrl = "https://www.youtube.com/watch?v=Fyzz8QV35FE";
      navigator.clipboard.writeText(videoUrl).then(() => {
        alert("유튜브 원본 주소가 클립보드에 복사되었습니다! ✨");
      }).catch(err => {
        console.error("복사 실패:", err);
      });
    }

    // Bookmark / Quick Note feature using localStorage
    const STORAGE_KEY = 'yt_ambient_notes_v1';
    let notes = [];

    // Load initial notes
    function loadNotes() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        try {
          notes = JSON.parse(stored);
        } catch(e) {
          notes = [];
        }
      } else {
        // Sample seed note
        notes = [{ id: Date.now(), text: "🎧 감상 중 마음에 드는 구절을 이곳에 적어보세요." }];
      }
      renderNotes();
    }

    function saveNotes() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
    }

    function renderNotes() {
      const container = document.getElementById('notesList');
      container.innerHTML = '';
      
      if (notes.length === 0) {
        container.innerHTML = `<div style="text-align: center; color: var(--text-secondary); font-size: 0.8rem; margin: 15px 0;">작성된 감상 노트가 없습니다.</div>`;
        return;
      }

      notes.forEach(note => {
        const itemHtml = `
          <div class="note-item">
            <span class="note-text">${escapeHtml(note.text)}</span>
            <button class="btn-delete-note" onclick="deleteNote(${note.id})" aria-label="노트 삭제">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        `;
        container.innerHTML += itemHtml;
      });
    }

    function addNote() {
      const input = document.getElementById('noteInput');
      const text = input.value.trim();
      if (!text) return;

      const newNote = {
        id: Date.now(),
        text: text
      };
      
      notes.unshift(newNote); // Put newer notes on top
      saveNotes();
      renderNotes();
      input.value = '';
    }

    function handleNoteKeypress(event) {
      if (event.key === 'Enter') {
        addNote();
      }
    }

    function deleteNote(id) {
      notes = notes.filter(n => n.id !== id);
      saveNotes();
      renderNotes();
    }

    // Helper to escape HTML tags to prevent XSS
    function escapeHtml(unsafe) {
      return unsafe
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Initialize Notes
    window.onload = function() {
      loadNotes();
    };
  </script>
</body>
</html>
