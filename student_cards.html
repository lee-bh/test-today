<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>13주차 과제 현황판 - 학생별 카드 대시보드</title>
  <meta name="description" content="시각디자인 및 조형예술 전공 학생들의 13주차 웹퍼블리싱 과제 제출 현황을 한눈에 관리하고 탐색하는 프리미엄 대시보드입니다.">
  
  <!-- SEO Open Graph -->
  <meta property="og:title" content="13주차 과제 현황판 - 학생별 카드 대시보드">
  <meta property="og:description" content="실시간 동기화 기능이 탑재된 학생별 과제 제출 현황 대시보드">
  <meta property="og:type" content="website">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">

  <style>
    /* CSS Variables & Premium Color Palettes */
    :root {
      --bg-color: #0b0f19;
      --gradient-base: radial-gradient(circle at 50% 50%, #151a30 0%, #0b0f19 100%);
      --glass-bg: rgba(255, 255, 255, 0.02);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-highlight: rgba(255, 255, 255, 0.12);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      
      --accent-submitted: #10b981;
      --accent-submitted-glow: rgba(16, 185, 129, 0.25);
      --accent-pending: #f59e0b;
      --accent-pending-glow: rgba(245, 158, 11, 0.25);
      --accent-purple: #8b5cf6;
      --accent-purple-glow: rgba(139, 92, 246, 0.35);

      --card-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);
      --transition-smooth: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', 'Noto Sans KR', sans-serif;
      background: var(--bg-color);
      background: var(--gradient-base);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px 20px;
      overflow-x: hidden;
    }

    /* Decorative Background Glowing Orbs */
    .bg-glow-1 {
      position: absolute;
      top: 10%;
      left: 5%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.1) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
      z-index: -1;
      filter: blur(50px);
    }

    .bg-glow-2 {
      position: absolute;
      bottom: 10%;
      right: 5%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.08) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
      z-index: -1;
      filter: blur(60px);
    }

    /* Main Container */
    .dashboard-wrapper {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      gap: 30px;
      z-index: 10;
    }

    /* Header Section */
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 20px;
      border-bottom: 1px solid var(--glass-border);
      padding-bottom: 25px;
    }

    .header-titles h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #ffffff 30%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .header-titles p {
      font-size: 1rem;
      color: var(--text-secondary);
      font-weight: 400;
    }

    /* Dynamic Sync Badge */
    .sync-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      padding: 8px 16px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .sync-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--accent-purple);
      box-shadow: 0 0 10px var(--accent-purple);
    }

    .sync-badge.live .sync-indicator {
      background-color: var(--accent-submitted);
      box-shadow: 0 0 10px var(--accent-submitted);
      animation: pulse-green 1.5s infinite alternate;
    }

    .sync-badge.cached .sync-indicator {
      background-color: #60a5fa;
      box-shadow: 0 0 10px #60a5fa;
    }

    @keyframes pulse-green {
      0% { opacity: 0.6; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1.2); }
    }

    /* Analytics Overview Bar */
    .analytics-panel {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 30px;
      box-shadow: var(--card-shadow);
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr 1fr;
      gap: 30px;
      align-items: center;
      animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .analytics-radial-col {
      display: flex;
      align-items: center;
      gap: 20px;
      border-right: 1px solid var(--glass-border);
      padding-right: 20px;
    }

    .radial-chart-container {
      position: relative;
      width: 80px;
      height: 80px;
    }

    .radial-chart-svg {
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
    }

    .radial-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.05);
      stroke-width: 8;
    }

    .radial-progress {
      fill: none;
      stroke: var(--accent-purple);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-dasharray: 226;
      stroke-dashoffset: 226;
      transition: stroke-dashoffset 1.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .radial-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text-primary);
    }

    .radial-info {
      display: flex;
      flex-direction: column;
    }

    .radial-label {
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-weight: 500;
      margin-bottom: 4px;
    }

    .radial-val {
      font-size: 1.5rem;
      font-weight: 800;
    }

    /* Analytics Numeric Card */
    .stat-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stat-box.border-r {
      border-right: 1px solid var(--glass-border);
      padding-right: 20px;
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .stat-num {
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1;
      display: flex;
      align-items: baseline;
      gap: 4px;
    }

    .stat-num span {
      font-size: 1rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .stat-num.submitted { color: var(--accent-submitted); text-shadow: 0 0 15px var(--accent-submitted-glow); }
    .stat-num.pending { color: var(--accent-pending); text-shadow: 0 0 15px var(--accent-pending-glow); }

    /* Interactive Filters Header */
    .controls-panel {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .search-bar-container {
      position: relative;
      flex-grow: 1;
      max-width: 400px;
    }

    .search-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 12px 18px 12px 46px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: var(--transition-smooth);
    }

    .search-input:focus {
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--accent-purple);
      box-shadow: 0 0 15px rgba(139, 92, 246, 0.15);
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      pointer-events: none;
    }

    .filter-groups {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      color: var(--text-secondary);
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-smooth);
      font-family: inherit;
    }

    .filter-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      transform: translateY(-1px);
    }

    .filter-btn.active {
      background: var(--text-primary);
      color: var(--bg-color);
      border-color: var(--text-primary);
    }

    .select-dropdown {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      color: var(--text-primary);
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      font-family: inherit;
      transition: var(--transition-smooth);
    }

    .select-dropdown:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
    }

    /* Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 25px;
      min-height: 200px;
    }

    /* Student Card */
    .student-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 20px;
      transition: var(--transition-smooth);
      position: relative;
      overflow: hidden;
      animation: zoomIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Neon Accent Borders based on Status */
    .student-card.submitted {
      border-left: 4px solid var(--accent-submitted);
    }
    
    .student-card.pending {
      border-left: 4px solid var(--accent-pending);
    }

    .student-card::after {
      content: '';
      position: absolute;
      width: 120px;
      height: 120px;
      top: -60px;
      right: -60px;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0.15;
      transition: var(--transition-smooth);
    }

    .student-card.submitted::after {
      background: radial-gradient(circle, var(--accent-submitted) 0%, transparent 70%);
    }

    .student-card.pending::after {
      background: radial-gradient(circle, var(--accent-pending) 0%, transparent 70%);
    }

    .student-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 35px rgba(0, 0, 0, 0.35);
      border-color: rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.04);
    }

    .student-card:hover::after {
      opacity: 0.25;
      transform: scale(1.2);
    }

    /* Card Top Header */
    .card-header {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .student-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      font-weight: 800;
      color: #fff;
      transition: var(--transition-smooth);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
    }

    .student-card.submitted .student-avatar {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    }

    .student-card.pending .student-avatar {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    }

    .student-card:hover .student-avatar {
      transform: scale(1.05) rotate(5deg);
    }

    .student-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .student-name-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .student-name {
      font-size: 1.2rem;
      font-weight: 750;
      color: #ffffff;
    }

    .student-grade {
      font-size: 0.8rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .student-id {
      font-size: 0.82rem;
      color: var(--text-secondary);
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .major-badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      color: #a78bfa;
      align-self: flex-start;
      margin-top: 2px;
    }

    /* Week 13 Submission Status Section */
    .status-section {
      background: rgba(255, 255, 255, 0.015);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      padding: 14px;
    }

    .status-section-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .status-badge-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-indicator-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 30px;
    }

    .submitted .status-indicator-badge {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: var(--accent-submitted);
    }

    .pending .status-indicator-badge {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.2);
      color: var(--accent-pending);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .submitted .status-dot { background-color: var(--accent-submitted); }
    .pending .status-dot { background-color: var(--accent-pending); }

    .folder-display {
      font-size: 0.8rem;
      color: var(--text-secondary);
      font-family: 'Outfit', monospace;
      font-weight: 500;
    }

    /* Weekly Progress Micro Track */
    .history-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .history-header {
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .timeline-track {
      display: flex;
      gap: 5px;
    }

    .timeline-node {
      flex: 1;
      height: 12px;
      border-radius: 3px;
      position: relative;
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .timeline-node.empty {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.02);
    }

    .timeline-node.filled {
      background: rgba(168, 85, 247, 0.45);
      border: 1px solid rgba(168, 85, 247, 0.2);
    }

    .timeline-node.current-w {
      background: var(--accent-submitted);
      box-shadow: 0 0 5px var(--accent-submitted);
    }

    /* Tooltip styling */
    .timeline-node .tooltip {
      visibility: hidden;
      background-color: #1e293b;
      border: 1px solid var(--glass-border);
      color: #fff;
      text-align: center;
      padding: 6px 10px;
      border-radius: 6px;
      position: absolute;
      z-index: 100;
      bottom: 150%;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      font-size: 0.75rem;
      opacity: 0;
      transition: opacity 0.2s ease, visibility 0.2s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      pointer-events: none;
    }

    .timeline-node .tooltip::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      margin-left: -5px;
      border-width: 5px;
      border-style: solid;
      border-color: #1e293b transparent transparent transparent;
    }

    .timeline-node:hover .tooltip {
      visibility: visible;
      opacity: 1;
    }

    .timeline-node:hover {
      transform: scaleY(1.3);
      border-color: rgba(255,255,255,0.3);
    }

    /* Action Buttons Row */
    .card-actions {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }

    .btn-card {
      flex: 1;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: inherit;
      transition: var(--transition-smooth);
    }

    .btn-primary {
      background: var(--text-primary);
      color: var(--bg-color);
      border: 1px solid var(--text-primary);
    }

    .btn-primary:hover {
      background: transparent;
      color: var(--text-primary);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      color: var(--text-primary);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-disabled {
      background: rgba(255, 255, 255, 0.01) !important;
      border: 1px solid rgba(255, 255, 255, 0.03) !important;
      color: rgba(255, 255, 255, 0.15) !important;
      cursor: not-allowed !important;
      pointer-events: none;
    }

    /* Empty state */
    .empty-state {
      grid-column: 1 / -1;
      background: var(--glass-bg);
      border: 1px dashed var(--glass-border);
      border-radius: 20px;
      padding: 60px 20px;
      text-align: center;
      color: var(--text-secondary);
    }

    .empty-state svg {
      margin-bottom: 15px;
      opacity: 0.4;
    }

    /* Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .analytics-panel {
        grid-template-columns: 1fr;
        gap: 20px;
        padding: 24px;
      }

      .analytics-radial-col {
        border-right: none;
        border-bottom: 1px solid var(--glass-border);
        padding-right: 0;
        padding-bottom: 20px;
      }

      .stat-box.border-r {
        border-right: none;
        border-bottom: 1px solid var(--glass-border);
        padding-right: 0;
        padding-bottom: 20px;
      }

      .dashboard-header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

  <!-- Background Orbs -->
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <div class="dashboard-wrapper">
    
    <!-- Header -->
    <header class="dashboard-header">
      <div class="header-titles">
        <h1>13주차 과제 현황판</h1>
        <p>시각디자인 / 조형예술전공 학생들의 웹퍼블리싱 과제 상태 및 깃허브 발행 결과물</p>
      </div>

      <!-- Sync Status Badge -->
      <div class="sync-badge cached" id="syncStatusBadge">
        <div class="sync-indicator"></div>
        <span id="syncStatusText">로컬 데이터 캐시</span>
      </div>
    </header>

    <!-- Analytics Dashboard Overview -->
    <section class="analytics-panel">
      <!-- Circle Progress -->
      <div class="analytics-radial-col">
        <div class="radial-chart-container">
          <svg class="radial-chart-svg" viewBox="0 0 80 80">
            <circle class="radial-bg" cx="40" cy="40" r="36" />
            <circle class="radial-progress" id="completionWheel" cx="40" cy="40" r="36" />
          </svg>
          <div class="radial-text" id="completionRateText">0%</div>
        </div>
        <div class="radial-info">
          <span class="radial-label">13주차 제출 진행률</span>
          <span class="radial-val" id="analyticsSubmissionRatio">0 / 0 명</span>
        </div>
      </div>

      <!-- Total Students -->
      <div class="stat-box border-r">
        <span class="stat-label">총 인원</span>
        <div class="stat-num" id="statTotal">0 <span>명</span></div>
      </div>

      <!-- Completed -->
      <div class="stat-box border-r">
        <span class="stat-label">제출 완료</span>
        <div class="stat-num submitted" id="statSubmitted">0 <span>명</span></div>
      </div>

      <!-- Pending -->
      <div class="stat-box">
        <span class="stat-label">미제출</span>
        <div class="stat-num pending" id="statPending">0 <span>명</span></div>
      </div>
    </section>

    <!-- Search and Filters Panel -->
    <section class="controls-panel">

    // App state
    let studentsData = [];
    let statusFilter = 'all'; // 'all', 'done', 'pending'

    // Simple robust CSV parser
    function parseCSV(text) {
      const lines = text.split('\n');
      const parsed = [];
      
      lines.forEach(line => {
        const trimmed = line.trim();
        if (!trimmed) return;
        
        const row = [];
        let insideQuote = false;
        let entry = '';
        
        for (let i = 0; i < trimmed.length; i++) {
          const char = trimmed[i];
          if (char === '"') {
            insideQuote = !insideQuote;
          } else if (char === ',' && !insideQuote) {
            row.push(entry);
            entry = '';
          } else {
            entry += char;
          }
        }
        row.push(entry);
        
        // Filter out header lines, only capture rows starting with student index number
        if (row.length > 6 && !isNaN(row[0].trim()) && row[0].trim() !== '') {
          parsed.push(row);
        }
      });
      return parsed;
    }

    // Process parsed rows into rich student objects
    function processStudents(rows) {
      return rows.map(row => {
        const weeks = {};
        
        // W2 to W8 (cols 8 to 14)
        for (let i = 0; i <= 6; i++) {
          const colIdx = 8 + i;
          weeks[`W${i + 2}`] = row[colIdx] ? row[colIdx].trim() : '';
        }
        // W9 to W13 (cols 16 to 20)
        for (let i = 0; i <= 4; i++) {
          const colIdx = 16 + i;
          weeks[`W${i + 9}`] = row[colIdx] ? row[colIdx].trim() : '';
        }

        const w13_folder = weeks['W13'] || '';
        const w13_submitted = w13_folder.length > 0;

        return {
          no: row[0].trim(),
          major: row[1].trim(),
          studentId: row[2].trim(),
          grade: row[3].trim(),
          name: row[4].trim(),
          email: row[5].trim(),
          github: row[6] ? row[6].trim() : '',
          w13_folder: w13_folder,
          w13_submitted: w13_submitted,
          weeks: weeks
        };
      });
    }

    // Extract github username
    function getGithubUsername(url) {
      if (!url) return '';
      const clean = url.trim().replace(/\/$/, ""); // Remove trailing slash
      const parts = clean.split('/');
      return parts[parts.length - 1] || '';
    }

    // Build deployment links
    function buildAssignmentLink(githubUrl, folderName) {
      const username = getGithubUsername(githubUrl);
      if (!username || !folderName) return '#';
      // GitHub pages convention: https://[username].github.io/test-today/[folder]/
      return `https://${username}.github.io/test-today/${encodeURIComponent(folderName.trim())}/index.html`;
    }

    // Update Analytics Display
    function updateAnalytics(students) {
      const total = students.length;
      const completed = students.filter(s => s.w13_submitted).length;
      const pending = total - completed;
      const rate = total > 0 ? Math.round((completed / total) * 100) : 0;

      // Update counters
      document.getElementById('statTotal').innerHTML = `${total} <span>명</span>`;
      document.getElementById('statSubmitted').innerHTML = `${completed} <span>명</span>`;
      document.getElementById('statPending').innerHTML = `${pending} <span>명</span>`;
      document.getElementById('analyticsSubmissionRatio').innerText = `${completed} / ${total} 명`;
      document.getElementById('completionRateText').innerText = `${rate}%`;

      // Update radial progress circle
      const progressCircle = document.getElementById('completionWheel');
      const circumference = 2 * Math.PI * 36; // r=36 -> ~226
      const strokeOffset = circumference - (rate / 100) * circumference;
      progressCircle.style.strokeDashoffset = strokeOffset;
    }

        grid.innerHTML = `
          <div class="empty-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="8" y1="12" x2="16" y2="12"></line>
            </svg>
            <p>검색 조건에 맞는 학생이 없습니다.</p>
          </div>
        `;
        return;
      }

      students.forEach(s => {
        const username = getGithubUsername(s.github);
        const assignmentUrl = s.w13_submitted ? buildAssignmentLink(s.github, s.w13_folder) : '#';
        const initial = s.name.charAt(0);
        
        // Generate Weekly Timeline node elements (Weeks 2 to 13)
        let timelineHtml = '';
        for (let w = 2; w <= 13; w++) {
          const weekKey = `W${w}`;
          const isSubmitted = s.weeks[weekKey] && s.weeks[weekKey].trim().length > 0;
          const folderInfo = isSubmitted ? s.weeks[weekKey] : '미제출';
          const nodeClass = w === 13 ? (isSubmitted ? 'timeline-node current-w' : 'timeline-node empty') : (isSubmitted ? 'timeline-node filled' : 'timeline-node empty');
          
          timelineHtml += `
            <div class="${nodeClass}">

        card.innerHTML = `

            <!-- Header -->
            <div class="card-header">
              <div class="student-avatar">${initial}</div>
              <div class="student-meta">
                <div class="student-name-row">
                  <span class="student-name">${s.name}</span>
                  <span class="student-grade">${s.grade}학년</span>
                </div>
                <span class="student-id">${s.studentId}</span>
                <span class="major-badge">${s.major}</span>
              </div>
            </div>

            <!-- Email (with quick copy) -->
            <div style="font-size: 0.8rem; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; cursor: pointer;" onclick="copyToClipboard('${s.email}')" title="이메일 복사">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                <polyline points="22,6 12,13 2,6"/>
              </svg>
              <span>${s.email}</span>
            </div>

            <!-- 13th week assignment badge -->
            <div class="status-section">
              <div class="status-section-label">13주차 제출 현황</div>
              <div class="status-badge-row">
                <span class="status-indicator-badge">
                  <span class="status-dot"></span>
                  <span>${s.w13_submitted ? '제출 완료' : '미제출'}</span>
                </span>
                <span class="folder-display">${s.w13_submitted ? s.w13_folder : '-'}</span>
              </div>
            </div>

            <!-- Weekly assignment micro track -->
            <div class="history-section">
              <div class="history-header">학기 전반 과제 이력 (2주차~13주차)</div>
              <div class="timeline-track">
                ${timelineHtml}
              </div>
            </div>
          </div>

          <!-- Actions -->
          <div class="card-actions">
            <a href="${assignmentUrl}" class="btn-card btn-primary ${s.w13_submitted ? '' : 'btn-disabled'}" target="_blank" rel="noopener">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                <polyline points="15 3 21 3 21 9"></polyline>
                <line x1="10" y1="14" x2="21" y2="3"></line>
              </svg>
              <span>결과물 확인</span>
            </a>
            <a href="${s.github ? s.github + '/test-today' : '#'}" class="btn-card btn-secondary ${s.github ? '' : 'btn-disabled'}" target="_blank" rel="noopener">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
              </svg>
              <span>GitHub</span>
            </a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Filter and search dispatcher
    function filterStudents() {
      const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
      const majorQuery = document.getElementById('majorSelect').value;

      const filtered = studentsData.filter(s => {
        // Status filter
        if (statusFilter === 'done' && !s.w13_submitted) return false;
        if (statusFilter === 'pending' && s.w13_submitted) return false;

        // Major filter
        if (majorQuery !== 'all' && s.major !== majorQuery) return false;

        // Search text query
        if (searchQuery) {
          const nameMatch = s.name.toLowerCase().includes(searchQuery);
          const idMatch = s.studentId.includes(searchQuery);
          const majorMatch = s.major.toLowerCase().includes(searchQuery);
          const githubMatch = s.github.toLowerCase().includes(searchQuery);
          return nameMatch || idMatch || majorMatch || githubMatch;
        }

        return true;
      });

      renderCards(filtered);
    }

    // Status filter state setter
    function setStatusFilter(filter) {
      statusFilter = filter;
      
      // Update UI button active states
      document.getElementById('btnFilterAll').classList.remove('active');
      document.getElementById('btnFilterDone').classList.remove('active');
      document.getElementById('btnFilterPending').classList.remove('active');

      if (filter === 'all') document.getElementById('btnFilterAll').classList.add('active');
      if (filter === 'done') document.getElementById('btnFilterDone').classList.add('active');
      if (filter === 'pending') document.getElementById('btnFilterPending').classList.add('active');

      filterStudents();
    }

    // Quick Clipboard utility
    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        alert(`이메일 주소 (${text})가 클립보드에 복사되었습니다! 📨`);
      });
    }

    // Async Fetch Core: Fetch live data from Google Sheets in background
    async function fetchLiveGoogleSheet() {
      const sheetCsvUrl = 'https://docs.google.com/spreadsheets/d/1HOLsxOcaA9PFJLg6r6mpWSgEEPIITT2Pn9rQZF_O_yA/export?format=csv';
      const badge = document.getElementById('syncStatusBadge');
      const text = document.getElementById('syncStatusText');

      try {
        const response = await fetch(sheetCsvUrl);
        if (!response.ok) throw new Error('Live fetch response error');
        
        const rawCsv = await response.text();
        const rows = parseCSV(rawCsv);
        
        if (rows.length > 0) {
          studentsData = processStudents(rows);
          
          // Render with live data
          updateAnalytics(studentsData);
          filterStudents();

          // Update status to Live Sync
          badge.className = 'sync-badge live';
          text.innerText = '실시간 동기화 완료';
          console.log('Successfully synced live Google Sheets data.');
        }
      } catch (err) {
        console.warn('Live Google Sheets fetch blocked by CORS or offline. Falling back to cached data.', err);
        // Ensure status indicates offline/cache usage
        badge.className = 'sync-badge cached';
        text.innerText = '로컬 데이터 캐시';
      }
    }

    // Initial Bootstrap
    function init() {
      // 1. Initial load from local fallback
      const cachedRows = parseCSV(FALLBACK_CSV);
      studentsData = processStudents(cachedRows);
      
      // Render fallback initially (zero latency load)
      updateAnalytics(studentsData);
      renderCards(studentsData);

      // 2. Trigger asynchronous live refresh
      fetchLiveGoogleSheet();
    }

    window.onload = init;
  </script>
</body>
</html>
